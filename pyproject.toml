[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "gursar-ai"
version = "0.1.0"
description = "GURSAR AI quote-first construction intake foundation"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "ezdxf>=1.4,<2",
  "pypdf>=5.9,<7",
  "pdfplumber>=0.11.10,<0.12",
  "ifcopenshell>=0.8.5,<0.9",
  "onnxruntime>=1.23,<2",
  "opencv-python>=4.13,<5",
  "pydantic>=2.10,<3",
  "PyYAML>=6,<7",
  "python-multipart>=0.0.20,<1",
  "rapidocr>=3.9.2,<4",
  "sqlalchemy>=2.0,<3",
  "structlog>=24.4,<26",
  "truststore>=0.10,<1",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
  "pyright>=1.1.400,<2",
  "ruff>=0.9,<1",
]
openai = ["openai>=1.60,<2"]
postgres = ["psycopg[binary]>=3.2,<4"]

[tool.setuptools]
package-dir = {"" = "backend"}

[tool.setuptools.packages.find]
where = ["backend"]

[tool.setuptools.package-data]
"app.modules.estimation" = ["config/*.yaml"]
"app.modules.knowledge_acquisition" = ["config/*.yaml"]
"app.modules.training" = ["config/*.yaml"]
"app.modules.acquisition" = ["config/*.yaml"]
"app.modules.architecture_intelligence" = ["config/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["backend"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["B008", "RUF001"]

[tool.ruff.lint.per-file-ignores]
"backend/alembic/versions/*.py" = ["E501"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
include = ["backend/app", "backend/tests"]
extraPaths = ["backend"]
venvPath = "."
venv = ".venv"
